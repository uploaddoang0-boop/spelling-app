<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focused Typist - Spelling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#323437">
</head>
<body>
    <div class="progress-container"><div id="progress-bar"></div></div>

    <header>
        <div class="logo">spelling.<span>type</span></div>
        <button id="btn-settings-toggle" class="icon-btn" title="Pengaturan">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </header>

    <!-- Modal Pengaturan -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Pengaturan Sistem</h2>
                <button id="btn-close-settings" class="close-btn">&times;</button>
            </div>
            
            <div class="control-group">
                <div class="toggle-row">
                    <button id="toggle-sound" class="toggle-btn">suara</button>
                    <button id="toggle-vibrate" class="toggle-btn">getar</button>
                </div>
            </div>

            <div class="control-group custom-builder">
                <h3>+ input kata kustom</h3>
                <input type="text" id="builder-level-name" placeholder="nama daftar (cth: geoteknik)" autocomplete="off">
                <div class="builder-inputs">
                    <input type="text" id="builder-word" placeholder="kata (inggris)" autocomplete="off">
                    <input type="text" id="builder-trans" placeholder="terjemahan" autocomplete="off">
                    <input type="text" id="builder-def" placeholder="definisi (opsional)" autocomplete="off">
                </div>
                <button id="btn-add-word" class="action-btn secondary">+ simpan kata</button>
                <ul id="builder-word-list"></ul>
                <button id="btn-save-level" class="action-btn accent" style="display: none;">patenkan pangkalan data</button>
            </div>

            <div class="control-group">
                <button id="btn-reset-weak" class="toggle-btn mobile-wide" style="margin-bottom: 5px;">reset kata sulit</button>
                <button id="btn-reset-star" class="toggle-btn mobile-wide" style="margin-bottom: 5px;">hapus semua bintang</button>
                <button id="btn-clear-data" class="danger-btn">format seluruh riwayat</button>
            </div>
        </div>
    </div>

    <main class="typing-container">
        <!-- Floating Config Bar -->
        <div class="config-bar">
            <!-- Grup 1: Kategori -->
            <div class="config-group">
                <button class="config-btn cat-btn" data-val="A1">a1</button>
                <button class="config-btn cat-btn" data-val="A2">a2</button>
                <button class="config-btn cat-btn" data-val="B1">b1</button>
                <button class="config-btn cat-btn" data-val="B2">b2</button>
                <button class="config-btn cat-btn" data-val="C1">c1</button>
                <button class="config-btn cat-btn" data-val="C2">c2</button>
            </div>
            <div class="config-sep"></div>
            <div class="config-group">
                <button class="config-btn cat-btn spec-btn" data-val="WEAK">⚡ sulit</button>
                <button class="config-btn cat-btn spec-btn" data-val="STAR">★ bintang</button>
                <button class="config-btn cat-btn spec-btn" data-val="CUSTOM">kustom</button>
            </div>
            <div class="config-sep"></div>
            <!-- Grup 2: Target Limit -->
            <div class="config-group">
                <button class="config-btn target-btn active" data-val="10">10</button>
                <button class="config-btn target-btn" data-val="25">25</button>
                <button class="config-btn target-btn" data-val="50">50</button>
                <button class="config-btn target-btn" id="btn-custom-target" data-val="CUSTOM">kustom</button>
                <input type="number" id="input-custom-target" class="custom-target-input hidden" placeholder="#">
                <button class="config-btn target-btn" data-val="ALL">semua</button>
            </div>
        </div>

        <div id="file-status" class="status-info">Kategori: - • 0 kata tersedia</div>
        <div id="session-stats" class="status-bar hidden">selesai: 0/0 &nbsp;|&nbsp; akurasi: 0%</div>
        
        <button id="btn-listen" class="audio-btn pill hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            dengarkan <span class="shortcut" style="margin-left: 5px; border:none; background:transparent;">[Tab]</span>
        </button>
        
        <div class="input-section">
            <div id="idle-text" class="idle-text">pilih konfigurasi level di atas untuk memulai.</div>
            <input type="text" id="word-input" class="hidden" autocomplete="off" spellcheck="false">
        </div>
        
        <button id="btn-submit" class="action-btn mobile-wide hidden" style="margin-bottom: 2rem;">periksa</button>

        <div id="feedback-area"></div>
        
        <button id="btn-next" class="action-btn mobile-wide dark-btn hidden" style="margin-top: 15px;">kata selanjutnya &raquo;</button>
    </main>

    <script src="levels.js"></script>
    <script src="script.js"></script>
</body>
</html>
